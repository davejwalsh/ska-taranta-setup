{{- /*
Grafana dashboards for the HDB++ archive, generated by `ska-taranta
archiver-dashboard` into this chart's grafana/ folder. Grafana's sidecar
loads every ConfigMap labelled grafana_dashboard, and reloads it on upgrade.
*/}}
{{- if (.Values.grafana).enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-archive-dashboards
  labels:
    grafana_dashboard: "1"
data:
{{- (.Files.Glob "grafana/*.json").AsConfig | nindent 2 }}
{{- end }}
